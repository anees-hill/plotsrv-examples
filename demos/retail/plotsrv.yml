server-settings:
  bind:
    host: 127.0.0.1
    port: 8101
  ingestion:
    bearer_token_env: PLOTSRV_RETAIL_TOKEN
    allow_remote_without_key: false
  admission:
    mode: catalogue-locked
    allowed_ids:
    - retail:orders
    - retail:sales
    - retail:categories
    - retail:returns
    - retail:fulfillment
    - retail:guide
    - retail:summary
    - retail:log:orders
    - retail:log:fulfillment
publisher-settings:
  destination:
    url: http://127.0.0.1:8101
    bearer_token_env: PLOTSRV_RETAIL_TOKEN
security-settings:
  docs_enabled: false
  openapi_enabled: false
  shutdown_enabled: false
  tracebacks_enabled: false
  control_local_only: true
  views_local_only: true
  status_local_only: false
  history_local_only: false
render-settings:
  table_view_mode: rich
  plot_dpi: 105
  html_sanitize: false
  html_sandbox: ''
  markdown_sanitize: true
storage-settings:
  enabled: true
  root_dir: .plotsrv/retail
  default_keep_last: 3
  max_snapshot_size_mb: 3
  max_pending_tasks: 12
  max_pending_mb: 24
  latest:
    enabled: true
    max_size_mb: 3
    min_store_interval_s: 0
    restore_scope: all
  views:
    retail:orders:
      enabled: true
      keep_last: 3
    retail:sales:
      enabled: true
      keep_last: 3
    retail:categories:
      enabled: true
      keep_last: 3
    retail:returns:
      enabled: true
      keep_last: 3
    retail:fulfillment:
      enabled: true
      keep_last: 3
    retail:guide:
      enabled: true
      keep_last: 3
    retail:summary:
      enabled: false
      latest_enabled: true
    retail:log:orders:
      enabled: false
      latest_enabled: false
    retail:log:fulfillment:
      enabled: false
      latest_enabled: false
  default_min_store_interval: null
  streams:
    enabled: false
limits:
  published_objects:
    max_plot_bytes: 1048576
    max_table_rows: 1800
    max_table_columns: 20
    max_artifact_text_chars: 131072
    max_json_container_items: 2000
  truncate_after:
    table_rows: 1800
    table_columns: 20
    text: 65536
    markdown: 131072
    html: 131072
ui-settings:
  show_view_descriptions: false
  page_title: Northstar Outdoors · plotsrv demo
  header_text: Northstar Outdoors
  show_history_controls: true
  featured_views:
  - view: retail:orders
    title: Explore orders
    thumbnail: previews/orders.png
  - view: retail:guide
    title: Trading review
    thumbnail: previews/guide.png
  icon_url: https://demo.plotsrv.com
  logo: northstar.svg
  header_fill_colour: '#eaf4f0'
  compact_views:
  - view: retail:log:orders
    title: Order processing log
  - view: retail:log:fulfillment
    title: Fulfilment API access log
browser-update-settings:
  max_connections: 96
  max_connections_per_client: 64
  max_connection_seconds: 600
freshness-settings:
  enabled: true
  views:
    retail:orders:
      enabled: false
    retail:sales:
      enabled: false
    retail:categories:
      enabled: false
    retail:returns:
      enabled: false
    retail:fulfillment:
      enabled: false
    retail:guide:
      enabled: false
    retail:summary:
      enabled: true
      expected_every: 5m
      warn_after: 10m
      overdue_after: 15m
    retail:log:orders:
      enabled: false
    retail:log:fulfillment:
      enabled: false
description-settings:
  views:
    retail:orders: 'Trading team: each row is an order line. Filter by product, size or region to
      investigate returns and delivery delays; compare September with neighbouring months to review
      the promotion. Sales are after discounts, and gross profit excludes refunds, shipping and overheads.
      Snapshots cover earlier reporting periods. All records are fictional.'
    retail:sales: 'Finance: compare monthly booked sales with gross profit before returns. September
      2025 includes a 20% promotion while product costs stay unchanged, so higher revenue need not
      mean better profit. Use the orders register to investigate the mix behind a month. Saved snapshots
      end at earlier reporting periods. Fictional data.'
    retail:categories: 'Buying team: each cell is a category''s booked sales for one month, in GBP.
      Darker cells mean higher sales. Compare the same category across months to identify seasonal
      demand, then check the orders register before planning stock. Category totals reconcile to
      the sales plot; refunds are excluded. Fictional data.'
    retail:returns: 'Customer support: each point is a product. The horizontal axis shows units ordered;
      the vertical axis shows the percentage of orders returned. Investigate the Summit Rain Shell
      by size in the orders register, and read the recorded return reasons. A return rate counts
      orders, not individual units. Fictional data.'
    retail:fulfillment: 'Operations: compare delivery times by region against the dashed three-day
      target. Each box covers the middle half of orders, the line is the median, and dots mark unusually
      long or short times. The West region includes an earlier period of delays: filter the orders
      register by date to see whether service improved. Fictional data.'
    retail:guide: 'Commercial team: this review brings together sales, gross profit, returns and
      delivery performance for the planning meeting. The category table shows booked sales; use the
      orders register for the detail behind each total. Read the priorities before the next review,
      and use snapshots to compare earlier reporting periods. Northstar Outdoors and its transactions
      are fictional.'
    retail:summary: 'Data team: expand Coverage for the reporting period and field groups, Totals
      for financial and service measures, and Data quality for missing values or reconciliation errors.
      Category and region totals come from the same orders register. This fixed example intentionally
      becomes stale after ten minutes and overdue after fifteen; its badge demonstrates freshness,
      not a failed refresh job.'
    retail:log:orders: 'Operations support: a watched, static extract from order validation and reconciliation.
      Read each warning with the following action to see how the batch was handled. Timestamp styling
      highlights dates and severity; use Wrap for long lines. Batch references and messages are synthetic.
      The file is deliberately small and is not continuously appended to.'
    retail:log:fulfillment: 'Integration support: a watched HTTP access-log extract for warehouse
      dispatch calls. Follow the temporary 503 response and successful retry, using request paths
      and status codes to trace the sequence. HTTP styling highlights methods, paths and response
      codes. Addresses and requests are fictional, and this small sample file stays unchanged.'
code-settings:
  views:
    retail:log:orders:
      style: timestamp
    retail:log:fulfillment:
      style: http
