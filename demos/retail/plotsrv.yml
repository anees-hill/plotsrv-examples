server-settings:
  bind:
    host: 127.0.0.1
    port: 8101
  ingestion:
    bearer_token_env: PLOTSRV_RETAIL_TOKEN
    allow_remote_without_key: false
  admission:
    mode: catalogue-locked
    allowed_ids:
    - retail:orders
    - retail:sales
    - retail:categories
    - retail:returns
    - retail:fulfillment
    - retail:guide
    - retail:summary
    - retail:log:orders
    - retail:log:fulfillment
publisher-settings:
  destination:
    url: http://127.0.0.1:8101
    bearer_token_env: PLOTSRV_RETAIL_TOKEN
security-settings:
  docs_enabled: false
  openapi_enabled: false
  shutdown_enabled: false
  tracebacks_enabled: false
  control_local_only: true
  views_local_only: true
  status_local_only: false
  history_local_only: false
render-settings:
  table_view_mode: rich
  plot_dpi: 105
  html_sanitize: false
  html_sandbox: ''
  markdown_sanitize: true
storage-settings:
  enabled: true
  root_dir: .plotsrv/retail
  default_keep_last: 3
  max_snapshot_size_mb: 3
  max_pending_tasks: 12
  max_pending_mb: 24
  latest:
    enabled: true
    max_size_mb: 3
    min_store_interval_s: 0
    restore_scope: all
  views:
    retail:orders:
      enabled: true
      keep_last: 3
    retail:sales:
      enabled: true
      keep_last: 3
    retail:categories:
      enabled: true
      keep_last: 3
    retail:returns:
      enabled: true
      keep_last: 3
    retail:fulfillment:
      enabled: true
      keep_last: 3
    retail:guide:
      enabled: true
      keep_last: 3
    retail:summary:
      enabled: false
      latest_enabled: true
    retail:log:orders:
      enabled: false
      latest_enabled: false
    retail:log:fulfillment:
      enabled: false
      latest_enabled: false
  default_min_store_interval: null
  streams:
    enabled: false
limits:
  published_objects:
    max_plot_bytes: 1048576
    max_table_rows: 1800
    max_table_columns: 20
    max_artifact_text_chars: 131072
    max_json_container_items: 2000
  truncate_after:
    table_rows: 1800
    table_columns: 20
    text: 65536
    markdown: 131072
    html: 131072
ui-settings:
  page_title: Northstar Outdoors · plotsrv demo
  header_text: Northstar Outdoors
  show_history_controls: true
  featured_views:
  - view: retail:orders
    title: Explore orders
    caption: Order register · January 2025 to June 2026
    thumbnail: previews/orders.png
  - view: retail:guide
    title: Trading review
    caption: The Northstar commercial report
    thumbnail: previews/guide.png
  icon_url: https://demo.plotsrv.com
  logo: northstar.svg
  header_fill_colour: '#eaf4f0'
  compact_views:
  - view: retail:log:orders
    title: Order processing log
  - view: retail:log:fulfillment
    title: Fulfilment API access log
browser-update-settings:
  max_connections: 96
  max_connections_per_client: 64
  max_connection_seconds: 600
freshness-settings:
  enabled: true
  views:
    retail:orders:
      enabled: false
    retail:sales:
      enabled: false
    retail:categories:
      enabled: false
    retail:returns:
      enabled: false
    retail:fulfillment:
      enabled: false
    retail:guide:
      enabled: false
    retail:summary:
      enabled: true
      expected_every: 5m
      warn_after: 10m
      overdue_after: 15m
    retail:log:orders:
      enabled: false
    retail:log:fulfillment:
      enabled: false
description-settings:
  views:
    retail:orders: 'Trading team: use these order lines to reconcile booked sales and investigate
      product, size and regional patterns. Gross profit excludes refunds, shipping and overheads.
      The reporting period runs from January 2025 to June 2026. Fictional data.'
    retail:sales: 'Finance: monthly booked sales and gross profit from the orders register. September
      2025 includes a 20% promotion with unchanged product costs. Compare both lines before assessing
      campaign performance. Fictional data.'
    retail:categories: 'Buying team: compare monthly category revenue to plan stock ahead of seasonal
      demand. Each cell is booked sales in GBP, before returns. The category totals reconcile to
      the orders register. Fictional data.'
    retail:returns: 'Customer support: compare order return rates against units sold for each product.
      Drill into the orders register by product and size before raising a supplier issue; rates here
      count orders, not units. Fictional data.'
    retail:fulfillment: 'Operations: fulfilment days by region, with a three-day service target.
      Boxes show the middle half of orders and points show unusual delays. Check order dates when
      investigating the West region. Fictional data.'
    retail:guide: 'Commercial team: the trading review combines sales, gross profit, returns and
      fulfilment findings for our next planning meeting. Use the saved editions to compare reporting
      periods. This company report uses fictional data.'
    retail:summary: 'Data team: coverage, financial reconciliation, completeness and field definitions
      for the orders dataset. We expect this summary every five minutes; this prepared example is
      deliberately left unchanged to show freshness warnings. Fictional data.'
    retail:log:orders: 'Operations support: a static extract from order validation and reconciliation.
      Timestamps, severity and batch references help trace warnings to their resolution. The watched
      file is synthetic and is not appended to on this demo server.'
    retail:log:fulfillment: 'Integration support: HTTP access log for warehouse dispatch requests,
      including a retry after a temporary upstream failure. Addresses and requests are fictional;
      this bounded watched file remains static.'
code-settings:
  views:
    retail:log:orders:
      style: timestamp
    retail:log:fulfillment:
      style: http
