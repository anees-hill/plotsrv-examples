server-settings:
  bind:
    host: 127.0.0.1
    port: 8101
  ingestion:
    bearer_token_env: PLOTSRV_RETAIL_TOKEN
    allow_remote_without_key: false
  admission:
    mode: catalogue-locked
    allowed_ids:
    - retail:orders
    - retail:sales
    - retail:categories
    - retail:returns
    - retail:fulfillment
    - retail:guide
    - retail:summary
    - retail:source:app-py
    - retail:source:generate_data-py
    - retail:source:plotsrv-yml
    - retail:source:publishing-py
    - retail:source:restore-py
publisher-settings:
  destination:
    url: http://127.0.0.1:8101
    bearer_token_env: PLOTSRV_RETAIL_TOKEN
security-settings:
  docs_enabled: false
  openapi_enabled: false
  shutdown_enabled: false
  tracebacks_enabled: false
  control_local_only: true
  views_local_only: true
  status_local_only: false
  history_local_only: false
render-settings:
  table_view_mode: rich
  plot_dpi: 105
  html_sanitize: false
  html_sandbox: ''
  markdown_sanitize: true
storage-settings:
  enabled: true
  root_dir: .plotsrv/retail
  default_keep_last: 3
  max_snapshot_size_mb: 3
  max_pending_tasks: 12
  max_pending_mb: 24
  latest:
    enabled: true
    max_size_mb: 3
    min_store_interval_s: 0
  views:
    retail:source:app-py:
      enabled: false
      latest_enabled: false
    retail:source:generate_data-py:
      enabled: false
      latest_enabled: false
    retail:source:plotsrv-yml:
      enabled: false
      latest_enabled: false
    retail:source:publishing-py:
      enabled: false
      latest_enabled: false
    retail:orders:
      enabled: true
      keep_last: 3
    retail:sales:
      enabled: true
      keep_last: 3
    retail:categories:
      enabled: true
      keep_last: 3
    retail:returns:
      enabled: true
      keep_last: 3
    retail:fulfillment:
      enabled: true
      keep_last: 3
    retail:guide:
      enabled: true
      keep_last: 3
    retail:summary:
      enabled: false
      latest_enabled: true
    retail:source:restore-py:
      enabled: false
      latest_enabled: false
  default_min_store_interval: null
  streams:
    enabled: false
limits:
  published_objects:
    max_plot_bytes: 1048576
    max_table_rows: 1800
    max_table_columns: 20
    max_artifact_text_chars: 131072
    max_json_container_items: 2000
  truncate_after:
    table_rows: 1800
    table_columns: 20
    text: 65536
    markdown: 131072
    html: 131072
ui-settings:
  page_title: Northstar Outdoors · plotsrv demo
  header_text: Northstar Outdoors
  show_history_controls: true
  featured_views:
  - view: retail:orders
    title: Explore orders
    caption: A year and a half on the trail
  - view: retail:guide
    title: Trading review
    caption: The Northstar commercial report
  icon_url: https://plotsrv.com
  logo: northstar.svg
  header_fill_colour: '#eaf4f0'
browser-update-settings:
  max_connections: 96
  max_connections_per_client: 64
  max_connection_seconds: 600
code-settings:
  views:
    retail:source:plotsrv-yml:
      language: yaml
      style: code
freshness-settings:
  enabled: true
  views:
    retail:orders:
      enabled: true
      expected_every: 5m
      warn_after: 10m
      overdue_after: 15m
    retail:sales:
      enabled: false
    retail:categories:
      enabled: false
    retail:returns:
      enabled: false
    retail:fulfillment:
      enabled: false
    retail:guide:
      enabled: true
      expected_every: 5m
      warn_after: 10m
      overdue_after: 15m
    retail:summary:
      enabled: false
    retail:source:app-py:
      enabled: false
    retail:source:generate_data-py:
      enabled: false
    retail:source:plotsrv-yml:
      enabled: false
    retail:source:publishing-py:
      enabled: false
    retail:source:restore-py:
      enabled: false
