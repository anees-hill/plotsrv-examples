server-settings:
  bind:
    host: 127.0.0.1
    port: 8103
  ingestion:
    bearer_token_env: PLOTSRV_SCANS_TOKEN
    allow_remote_without_key: false
  admission:
    mode: catalogue-locked
    allowed_ids:
    - scans:results
    - scans:example
    - scans:observed
    - scans:changes
    - scans:metrics
publisher-settings:
  destination:
    url: http://127.0.0.1:8103
    bearer_token_env: PLOTSRV_SCANS_TOKEN
security-settings:
  docs_enabled: false
  openapi_enabled: false
  shutdown_enabled: false
  tracebacks_enabled: false
  control_local_only: true
  views_local_only: true
  status_local_only: false
  history_local_only: false
render-settings:
  table_view_mode: rich
  html_sanitize: false
  html_sandbox: ''
  plot_dpi: 105
  markdown_sanitize: true
storage-settings:
  enabled: true
  root_dir: .plotsrv/scans-receiver
  default_keep_last: 7
  default_min_store_interval: 1s
  max_snapshot_size_mb: 2
  max_pending_tasks: 8
  max_pending_mb: 16
  latest:
    enabled: true
    max_size_mb: 2
    min_store_interval_s: 1
  views: {}
limits:
  published_objects:
    max_plot_bytes: 1048576
    max_table_rows: 20
    max_table_columns: 20
    max_artifact_text_chars: 131072
    max_json_container_items: 2000
  truncate_after:
    table_rows: 20
    table_columns: 20
    text: 65536
    markdown: 131072
    html: 131072
ui-settings:
  page_title: Document scans · plotsrv demo
  header_text: Document scan audit
  featured_views: []
  icon_url: https://demo.plotsrv.com
  show_history_controls: true
freshness-settings:
  enabled: true
  expected_every: 24h
  warn_after: 26h
  overdue_after: 48h
browser-update-settings:
  max_connections: 96
  max_connections_per_client: 64
  max_connection_seconds: 600
checks-settings:
  enabled: true
  rules:
  - id: scans-need-review
    name: Scans require review
    source: scans:metrics
    kind: state
    path:
    - review_count
    op: gt
    value: 0
    severity: warning
description-settings:
  views:
    scans:results: 'Document operations: one row per scanned sheet, with measured brightness, contrast
      and review flags. Filter for review items before accepting the batch. SHEET-01 is an intentionally
      dim calibration example. All documents are synthetic.'
    scans:example: 'Document operations: inspect the example sheet alongside its measured quality
      flags. The dim calibration sheet is deliberately retained so reviewers can see why it requires
      attention. This is a synthetic document.'
    scans:observed: 'Audit team: the latest completed scan run, its coverage and measured quality
      outcomes. Use this summary for the daily handover and the results table for sheet-level investigation.
      All documents are synthetic.'
    scans:changes: 'Audit team: changes since the previous completed run, including new or resolved
      quality flags. Snapshot capture times are real; daily synthetic batches provide controlled
      examples for reviewer training.'
    scans:metrics: 'Quality leads: machine-readable totals from the latest successful audit. The
      Scans require review check fires when review_count is greater than zero. The intentionally
      dim calibration sheet keeps this warning visible; documents are synthetic.'
