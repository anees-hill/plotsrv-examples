server-settings:
  bind: {host: 127.0.0.1, port: 8103}
  ingestion: {bearer_token_env: PLOTSRV_SCANS_TOKEN, allow_remote_without_key: false}
  admission:
    mode: catalogue-locked
    allowed_ids: ["scans:results", "scans:example", "scans:observed", "scans:changes"]
publisher-settings:
  destination: {url: "http://127.0.0.1:8103", bearer_token_env: PLOTSRV_SCANS_TOKEN}
security-settings:
  docs_enabled: false
  openapi_enabled: false
  shutdown_enabled: false
  tracebacks_enabled: false
  control_local_only: true
  views_local_only: true
  status_local_only: false
  history_local_only: false
render-settings:
  table_view_mode: rich
  html_sanitize: false
  html_sandbox: ""
storage-settings:
  enabled: true
  root_dir: .plotsrv/scans-receiver
  default_keep_last: 7
  default_min_store_interval: 1s
  max_snapshot_size_mb: 2
  max_pending_tasks: 8
  max_pending_mb: 16
  latest: {enabled: true, max_size_mb: 2, min_store_interval_s: 1}
limits:
  published_objects: {max_plot_bytes: 1048576, max_table_rows: 20, max_table_columns: 12, max_artifact_text_chars: 12000, max_json_container_items: 200}
ui-settings:
  page_title: "Document scans · plotsrv demo"
  header_text: "Document scan audit"
  featured_views:
    - {view: "scans:changes", title: "Since previous run", caption: "What changed while you were away"}
    - {view: "scans:results", title: "Scan results", caption: "Inspect the quality flags for each synthetic JPEG"}

freshness-settings:
  enabled: true
  expected_every: 24h
  warn_after: 26h
  overdue_after: 48h

browser-update-settings:
  max_connections: 96
  max_connections_per_client: 64
  max_connection_seconds: 600
