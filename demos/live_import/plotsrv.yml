server-settings:
  bind:
    host: 127.0.0.1
    port: 8102
  ingestion:
    bearer_token_env: PLOTSRV_LIVE_TOKEN
    allow_remote_without_key: false
  admission:
    mode: catalogue-locked
    allowed_ids:
    - live:imports
    - live:recent
    - live:exceptions
    - live:manifest
    - live:outcomes
    - live:durations
    - live:report
publisher-settings:
  destination:
    url: http://127.0.0.1:8102
    bearer_token_env: PLOTSRV_LIVE_TOKEN
security-settings:
  docs_enabled: false
  openapi_enabled: false
  shutdown_enabled: false
  tracebacks_enabled: false
  control_local_only: true
  views_local_only: true
  status_local_only: false
  history_local_only: false
storage-settings:
  enabled: true
  views:
    live:recent:
      enabled: true
      keep_last: 3
    live:exceptions:
      enabled: true
      keep_last: 3
    live:manifest:
      enabled: true
      keep_last: 3
    live:outcomes:
      enabled: true
      keep_last: 3
    live:durations:
      enabled: true
      keep_last: 3
    live:report:
      enabled: true
      keep_last: 3
    live:imports:
      enabled: false
      latest_enabled: false
  default_keep_last: 3
  default_min_store_interval: null
  max_snapshot_size_mb: 3
  max_pending_tasks: 12
  max_pending_mb: 24
  root_dir: .plotsrv/import-reports
  latest:
    enabled: true
    max_size_mb: 3
    min_store_interval_s: 0
  streams:
    enabled: false
stream-settings:
  retention:
    max_raw_records: 1000
    max_raw_mb: 2
    max_total_raw_mb: 4
    max_noteworthy_items: 64
ui-settings:
  show_view_descriptions: false
  page_title: Live imports · plotsrv demo
  header_text: Live file imports
  featured_views:
  - view: live:imports
    title: Live import log
    thumbnail: previews/imports.png
  - view: live:report
    title: Import operations
    thumbnail: previews/report.png
  - view: live:recent
    title: Explore imports
    thumbnail: previews/recent.png
  icon_url: https://demo.plotsrv.com
  show_history_controls: true
browser-update-settings:
  max_connections: 96
  max_connections_per_client: 64
  max_connection_seconds: 600
render-settings:
  table_view_mode: rich
  plot_dpi: 105
  html_sanitize: false
  html_sandbox: ''
  markdown_sanitize: true
limits:
  published_objects:
    max_plot_bytes: 1048576
    max_table_rows: 1000
    max_table_columns: 20
    max_artifact_text_chars: 131072
    max_json_container_items: 2000
  truncate_after:
    table_rows: 1000
    table_columns: 20
    text: 65536
    markdown: 131072
    html: 131072
description-settings:
  views:
    live:imports: 'Integration team: incoming validation events from our file-import worker. Recent
      records appear first; pause the view to inspect a record without new arrivals. The event generator
      runs every three seconds using fictional inputs.'
    live:recent: 'Data operations: one row per imported record, with source file, region, value and
      validation outcome. Filter by source or outcome to reconcile a batch. Saved editions show the
      same batch at successive processing stages. Fictional data.'
    live:exceptions: 'Data operations: records requiring correction before acceptance. Group by validation
      issue to allocate fixes, then use record IDs to locate the affected source rows in the import
      register. Fictional data.'
    live:manifest: 'Integration team: batch counts, schema and source-file details for the prepared
      import report. We expect a manifest refresh every five minutes; this fixed example intentionally
      becomes stale to demonstrate freshness warnings. Fictional data.'
    live:outcomes: 'Operations leads: accepted and quarantined record counts in 90-second windows
      across all feeds. Use the exceptions table and manifest for a breakdown by source file.
      All counts come from the same prepared batch. Fictional data.'
    live:durations: 'Platform team: simulated per-record validation times by source file. Compare
      medians and spread before investigating slow feeds; these are example processing durations,
      not measurements of the demo server.'
    live:report: 'Operations leads: batch status, source performance and follow-up actions for the
      daily handover. This report, register, exceptions and manifest describe the same prepared batch.
      Saved editions illustrate progress; data is fictional.'
freshness-settings:
  enabled: true
  views:
    live:imports:
      enabled: false
    live:recent:
      enabled: false
    live:exceptions:
      enabled: false
    live:manifest:
      enabled: true
      expected_every: 5m
      warn_after: 10m
      overdue_after: 15m
    live:outcomes:
      enabled: false
    live:durations:
      enabled: false
    live:report:
      enabled: false
