artifact-render-settings:
  html_sanitize: false

render-settings:
  default:
    plot_dpi: 200
    plot_default_figsize_in: "12,6"
    plot_bbox_tight: true
    plot_pad_inches: 0.10

view-order-settings:
  sections: [static-files]
  labels:
    plotnine: ["MEM-USED", "CPU%%"]

# Limits -----------
limits:
  watched_files:
    # Default watched-file input limit.
    # Use "off" for full-file reads globally, or override per view below.
    max_bytes: 5000000

  render:
    # Default renderer display limits for text-like views.
    # "off" means no renderer truncation.
    text: 1000000
    html: off
    markdown: off

  tables:
    max_rows: 50000000
    max_columns: 200

  views:
    # Long text file, head/tail variants
    static-files:text-head:
      watched_files:
        max_bytes: 60000
      render:
        text: 60000

    static-files:text-tail:
      watched_files:
        max_bytes: 60000
      render:
        text: 60000

    # Log file: read/show all for this smoke test
    static-files:long-log:
      watched_files:
        max_bytes: off
      render:
        text: off

    # HTML reports: read/show full report
    static-files:html-simple:
      watched_files:
        max_bytes: off
      render:
        html: off

    static-files:html-complex:
      watched_files:
        max_bytes: off
      render:
        html: off

    # Large CSVs: use larger watched-file input cap
    static-files:csv-very-large:
      watched_files:
        max_bytes: 1000000

    static-files:csv-large-head:
      watched_files:
        max_bytes: 1000000

    static-files:csv-large-tail:
      watched_files:
        max_bytes: 1000000

    static-files:csv-small:
      watched_files:
        max_bytes: 1000000

storage-settings:
  enabled: true
  root_dir: .plotsrv/store
  default_keep_last: 2
  max_snapshot_size_mb: 20

freshness-settings:
  enabled: true
  expected_every: 60s
  warn_after: 90s
  error_after: 180s

security-settings:
  tracebacks_enabled: false
