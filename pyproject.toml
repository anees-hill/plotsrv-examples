[project]
name = "plotsrv-examples"
version = "2.0.0"
description = "Portable examples and release assurance for an explicitly selected plotsrv candidate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.0",
    "plotnine>=0.15.3",
    "polars>=1.38.1",
    "pyarrow>=23.0.0",
    "psutil>=7.2.2",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "numpy>=2.4.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotsrv_examples"]

[dependency-groups]
dev = [
    "ipython>=9.13.0",
    "pytest>=9,<10",
]
