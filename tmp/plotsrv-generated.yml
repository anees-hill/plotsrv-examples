limits:
  watched_files:
    max_bytes: 5000000
  render:
    text: 1000000
    html: false
    markdown: false
  tables:
    max_rows: 10000
    max_columns: 200
  views:
    default:computer_resources (nested dict):
      render:
        text: '1000000'
        html: 'off'
        markdown: 'off'
    default:mixed_objects (nested list):
      render:
        text: '1000000'
        html: 'off'
        markdown: 'off'
    default:planet_metrics (pl.df):
      render:
        text: '1000000'
        html: 'off'
        markdown: 'off'
    default:planets (nested dict):
      render:
        text: '1000000'
        html: 'off'
        markdown: 'off'
    default:random array (np.array):
      render:
        text: '1000000'
        html: 'off'
        markdown: 'off'
    default:satellites (nested list):
      render:
        text: '1000000'
        html: 'off'
        markdown: 'off'
    default:weather_observations (nested list):
      render:
        text: '1000000'
        html: 'off'
        markdown: 'off'
    simple plots:planet gravity (matplotlib):
      render:
        text: '1000000'
        html: 'off'
        markdown: 'off'
    simple plots:planet temperature (plotnine):
      render:
        text: '1000000'
        html: 'off'
        markdown: 'off'
    traceback-tests:B1 - decorator on_error:
      render:
        text: '1000000'
        html: 'off'
        markdown: 'off'
table-settings:
  table_view_mode: rich
  max_table_rows_simple: 200
  max_table_rows_rich: 1000
artifact-render-settings:
  html_sanitize: false
  markdown_sanitize: true
render-settings:
  default:
    plot_dpi: 200
    plot_default_figsize_in: 12,6
    plot_bbox_tight: true
    plot_pad_inches: 0.1
storage-settings:
  enabled: true
  root_dir: .plotsrv/store
  default_keep_last: 2
  max_snapshot_size_mb: 20
  views:
    default:computer_resources (nested dict):
      enabled: true
      keep_last: 3
      min_store_interval: 10s
    default:mixed_objects (nested list):
      enabled: true
      keep_last: 3
      min_store_interval: 10s
    default:planet_metrics (pl.df):
      enabled: true
      keep_last: 3
      min_store_interval: 10s
    default:planets (nested dict):
      enabled: true
      keep_last: 3
      min_store_interval: 10s
    default:random array (np.array):
      enabled: true
      keep_last: 3
      min_store_interval: 10s
    default:satellites (nested list):
      enabled: true
      keep_last: 3
      min_store_interval: 10s
    default:weather_observations (nested list):
      enabled: true
      keep_last: 3
      min_store_interval: 10s
    simple plots:planet gravity (matplotlib):
      enabled: true
      keep_last: 3
      min_store_interval: 10s
    simple plots:planet temperature (plotnine):
      enabled: true
      keep_last: 3
      min_store_interval: 10s
    traceback-tests:B1 - decorator on_error:
      enabled: true
      keep_last: 3
      min_store_interval: 10s
freshness-settings:
  enabled: true
  expected_every: 60s
  warn_after: 90s
  overdue_after: 180s
  views:
    default:computer_resources (nested dict):
      expected_every: 30s
      warn_after: 45s
      overdue_after: 60s
    default:mixed_objects (nested list):
      expected_every: 30s
      warn_after: 45s
      overdue_after: 60s
    default:planet_metrics (pl.df):
      expected_every: 30s
      warn_after: 45s
      overdue_after: 60s
    default:planets (nested dict):
      expected_every: 30s
      warn_after: 45s
      overdue_after: 60s
    default:random array (np.array):
      expected_every: 30s
      warn_after: 45s
      overdue_after: 60s
    default:satellites (nested list):
      expected_every: 30s
      warn_after: 45s
      overdue_after: 60s
    default:weather_observations (nested list):
      expected_every: 30s
      warn_after: 45s
      overdue_after: 60s
    simple plots:planet gravity (matplotlib):
      expected_every: 30s
      warn_after: 45s
      overdue_after: 60s
    simple plots:planet temperature (plotnine):
      expected_every: 30s
      warn_after: 45s
      overdue_after: 60s
    traceback-tests:B1 - decorator on_error:
      expected_every: 30s
      warn_after: 45s
      overdue_after: 60s
security-settings:
  tracebacks_enabled: false
